# k8s-mcp-server: Deployment + Service
#
# Auth: the server uses the mcp/mcp-viewer-user ServiceAccount to access this cluster.
# Apply rbac.yaml to the cluster hosting this Deployment.
# A separate target cluster still requires its own supported credentials and kubeconfig.
#
# Then:
#   kubectl apply -f k8s-resources/k8s-mcp-server.yaml
#   kubectl -n mcp port-forward svc/k8s-mcp-server 8885:8885

---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
  labels:
    app.kubernetes.io/name: k8s-mcp-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp-server
  namespace: mcp
  labels:
    app.kubernetes.io/name: k8s-mcp-server
spec:
  # keep at 1: MCP sessions (mcp-session-id) and the active kube context live in process memory
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-mcp-server
    spec:
      serviceAccountName: mcp-viewer-user
      containers:
        - name: k8s-mcp-server
          image: dejanualex/k8s-mcp-server:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8885
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-mcp-server
  namespace: mcp
  labels:
    app.kubernetes.io/name: k8s-mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: k8s-mcp-server
  ports:
    - name: http
      port: 8885
      targetPort: http
      protocol: TCP
